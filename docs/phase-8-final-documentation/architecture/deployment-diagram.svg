<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%" style="background-color: #0f172a; font-family: 'Segoe UI', Inter, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <linearGradient id="ghGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="renGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="dbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <text x="500" y="35" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="bold" letter-spacing="1">STUDENT INFORMATION SYSTEM (SIS) — DEPLOYMENT TOPOLOGY</text>
  <text x="500" y="60" text-anchor="middle" fill="#94a3b8" font-size="13">Production Cloud Architecture • Phase 7</text>

  <!-- User / Internet -->
  <g transform="translate(500, 110)">
    <circle cx="0" cy="0" r="28" fill="#1e293b" stroke="#38bdf8" stroke-width="2" filter="url(#shadow)"/>
    <text x="0" y="8" text-anchor="middle" fill="#38bdf8" font-size="24">🌐</text>
    <text x="0" y="46" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="bold">Client Web Browsers (Internet)</text>
  </g>

  <!-- Line from User to GitHub Pages -->
  <line x1="500" y1="140" x2="500" y2="200" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="420" y="160" width="160" height="22" rx="4" fill="#0f172a" stroke="#38bdf8"/>
  <text x="500" y="175" text-anchor="middle" fill="#38bdf8" font-size="10" font-weight="bold">HTTPS (Port 443)</text>

  <!-- GitHub Pages Node -->
  <g transform="translate(150, 205)" filter="url(#shadow)">
    <rect width="700" height="110" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <rect width="700" height="30" rx="12" fill="url(#ghGrad)"/>
    <text x="350" y="20" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">DEPLOYMENT NODE: GitHub Pages (Global Edge Static Hosting)</text>
    <text x="350" y="55" text-anchor="middle" fill="#cbd5e1" font-size="12" font-weight="600">Frontend Client SPA (HTML5 / Vanilla CSS3 Glassmorphism / ES6+ Modules)</text>
    <text x="350" y="78" text-anchor="middle" fill="#94a3b8" font-size="11">Production Origin: https://yogan.github.io/OOAD-cap/</text>
  </g>

  <!-- Line from GitHub Pages to Render -->
  <line x1="500" y1="315" x2="500" y2="375" stroke="#6366f1" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="380" y="335" width="240" height="22" rx="4" fill="#0f172a" stroke="#6366f1"/>
  <text x="500" y="350" text-anchor="middle" fill="#818cf8" font-size="10" font-weight="bold">REST API (JSON over HTTPS + JWT)</text>

  <!-- Render Node -->
  <g transform="translate(150, 380)" filter="url(#shadow)">
    <rect width="700" height="110" rx="12" fill="#1e293b" stroke="#6366f1" stroke-width="2"/>
    <rect width="700" height="30" rx="12" fill="url(#renGrad)"/>
    <text x="350" y="20" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">DEPLOYMENT NODE: Render Web Service (Cloud Application Compute)</text>
    <text x="350" y="55" text-anchor="middle" fill="#cbd5e1" font-size="12" font-weight="600">5-Layer Object-Oriented REST API (Node.js 20 LTS / Express)</text>
    <text x="350" y="78" text-anchor="middle" fill="#94a3b8" font-size="11">Production API Endpoint: https://sis-ooad-backend.onrender.com/api/v1</text>
  </g>

  <!-- Line from Render to Database -->
  <line x1="500" y1="490" x2="500" y2="545" stroke="#10b981" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Database Node -->
  <g transform="translate(150, 550)" filter="url(#shadow)">
    <rect width="700" height="80" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <rect width="700" height="28" rx="12" fill="url(#dbGrad)"/>
    <text x="350" y="19" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="bold">DEPLOYMENT NODE: Relational Cloud Database Layer (PostgreSQL 15+)</text>
    <text x="350" y="52" text-anchor="middle" fill="#cbd5e1" font-size="11">ACID Relational Storage: users, students, faculty, admins, courses, enrollments, attendance, records</text>
  </g>

</svg>
