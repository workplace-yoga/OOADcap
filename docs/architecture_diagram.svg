<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" width="100%" height="100%" style="background-color: #0f172a; font-family: 'Segoe UI', Inter, sans-serif;">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <linearGradient id="feGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="beGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="dbGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <text x="550" y="40" text-anchor="middle" fill="#f8fafc" font-size="22" font-weight="bold" letter-spacing="1">STUDENT INFORMATION SYSTEM (SIS) — SYSTEM TOPOLOGY</text>
  <text x="550" y="65" text-anchor="middle" fill="#94a3b8" font-size="13">Decoupled Three-Tier Cloud Architecture • Phase 4</text>

  <!-- TIER 1: FRONTEND -->
  <g transform="translate(100, 110)" filter="url(#shadow)">
    <rect width="900" height="130" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <rect width="900" height="32" rx="12" fill="url(#feGrad)"/>
    <text x="450" y="22" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">TIER 1: FRONTEND CLIENT (Single Page Application — Hosted on GitHub Pages)</text>
    
    <!-- Sub-boxes -->
    <rect x="30" y="50" width="260" height="60" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="160" y="75" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="bold">Admin Portal View</text>
    <text x="160" y="95" text-anchor="middle" fill="#94a3b8" font-size="10">CRUD Students, Faculty, Courses</text>

    <rect x="320" y="50" width="260" height="60" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="450" y="75" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="bold">Faculty Portal View</text>
    <text x="450" y="95" text-anchor="middle" fill="#94a3b8" font-size="10">Attendance Log &amp; Marks Entry</text>

    <rect x="610" y="50" width="260" height="60" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="740" y="75" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="bold">Student Portal View</text>
    <text x="740" y="95" text-anchor="middle" fill="#94a3b8" font-size="10">Attendance % &amp; Academic Transcript</text>
  </g>

  <!-- Connectors: Tier 1 -> Tier 2 -->
  <line x1="550" y1="240" x2="550" y2="295" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="420" y="255" width="260" height="24" rx="4" fill="#0f172a" stroke="#38bdf8"/>
  <text x="550" y="271" text-anchor="middle" fill="#38bdf8" font-size="11" font-weight="bold">REST API (JSON over HTTPS + JWT)</text>

  <!-- TIER 2: BACKEND -->
  <g transform="translate(100, 305)" filter="url(#shadow)">
    <rect width="900" height="150" rx="12" fill="#1e293b" stroke="#6366f1" stroke-width="2"/>
    <rect width="900" height="32" rx="12" fill="url(#beGrad)"/>
    <text x="450" y="22" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">TIER 2: BACKEND SERVICE (Node.js / Express REST API — Hosted on Render)</text>
    
    <!-- Sub-boxes -->
    <rect x="25" y="50" width="195" height="80" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="122" y="72" text-anchor="middle" fill="#818cf8" font-size="11" font-weight="bold">Presentation Layer</text>
    <text x="122" y="90" text-anchor="middle" fill="#94a3b8" font-size="10">Express Controllers</text>
    <text x="122" y="106" text-anchor="middle" fill="#94a3b8" font-size="10">JWT Auth Guards</text>

    <rect x="245" y="50" width="195" height="80" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="342" y="72" text-anchor="middle" fill="#818cf8" font-size="11" font-weight="bold">Application Services</text>
    <text x="342" y="90" text-anchor="middle" fill="#94a3b8" font-size="10">Auth, Student, Course</text>
    <text x="342" y="106" text-anchor="middle" fill="#94a3b8" font-size="10">Attendance, Marks</text>

    <rect x="465" y="50" width="195" height="80" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="562" y="72" text-anchor="middle" fill="#818cf8" font-size="11" font-weight="bold">Domain Model</text>
    <text x="562" y="90" text-anchor="middle" fill="#94a3b8" font-size="10">User, Student, Course</text>
    <text x="562" y="106" text-anchor="middle" fill="#94a3b8" font-size="10">Enrollment, Invariants</text>

    <rect x="685" y="50" width="190" height="80" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="780" y="72" text-anchor="middle" fill="#818cf8" font-size="11" font-weight="bold">Persistence Layer</text>
    <text x="780" y="90" text-anchor="middle" fill="#94a3b8" font-size="10">Repository Adapters</text>
    <text x="780" y="106" text-anchor="middle" fill="#94a3b8" font-size="10">SQL Parameterization</text>
  </g>

  <!-- Connectors: Tier 2 -> Tier 3 -->
  <line x1="550" y1="455" x2="550" y2="510" stroke="#10b981" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="420" y="470" width="260" height="24" rx="4" fill="#0f172a" stroke="#10b981"/>
  <text x="550" y="486" text-anchor="middle" fill="#10b981" font-size="11" font-weight="bold">TLS Encrypted Connection Pool</text>

  <!-- TIER 3: DATABASE -->
  <g transform="translate(100, 520)" filter="url(#shadow)">
    <rect width="900" height="120" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <rect width="900" height="32" rx="12" fill="url(#dbGrad)"/>
    <text x="450" y="22" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">TIER 3: DATA PERSISTENCE (Cloud Relational Database — PostgreSQL)</text>
    
    <text x="450" y="65" text-anchor="middle" fill="#cbd5e1" font-size="12">Normalized Relational Schema: users, students, faculty, admins, courses, enrollments, attendance, academic_records</text>
    <text x="450" y="88" text-anchor="middle" fill="#94a3b8" font-size="11">ACID Transactional Guarantees • Foreign Key Constraints • Indexed Lookups</text>
  </g>

</svg>
